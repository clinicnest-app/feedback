name: Bug report
description: Something in ClinicNest does not work as it should
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Everything written here is public.** Do not include patient names, phone numbers, patient IDs or screenshots that show a patient. Use made-up data, or write to support@clinicnest.app instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what did ClinicNest do? Copy any message it showed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: version
    attributes:
      label: ClinicNest version
      description: Settings → About, for example 1.0.6
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Computer that runs ClinicNest
      options: [Windows, Mac, Linux / server, Not sure]
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options: [On the main computer, On another computer or phone in the clinic, Both, Not sure]
  - type: dropdown
    id: often
    attributes:
      label: How often?
      options: [Every time, Sometimes, Happened once]
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no patient information.
          required: true
